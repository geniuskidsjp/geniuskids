<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | GeniusKids</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      width: 380px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.3s;
    }

    .email-btn {
      background-color: #4e73df;
      color: white;
    }

    .email-btn:hover {
      background-color: #2e59d9;
    }

    .google-btn {
      background-color: #ea4335;
      color: white;
    }

    .google-btn:hover {
      background-color: #c5221f;
    }

    .divider {
      margin: 20px 0;
      font-size: 13px;
      color: #999;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #ddd;
      position: absolute;
      top: 50%;
      width: 40%;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    #msg {
      margin-top: 10px;
      color: red;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>GeniusKids Student Portal</h2>
  <div class="subtitle">Secure login for students and parents</div>

  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">

  <button class="email-btn" onclick="login()">Login with Email</button>

  <div class="divider">OR</div>

  <button class="google-btn" onclick="googleLogin()">Sign in with Google</button>

  <p id="msg"></p>
</div>

<script>
  const supabaseUrl = "https://ntfkpwfrwprrgoxidoub.supabase.co";
  const supabaseKey = "sb_publishable_J3QyzC6-gBXD9VfYRQhMtA_EZm4MYBc";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      document.getElementById('msg').innerText = error.message;
    } else {
      window.location.href = "portal.html";
    }
  }

  async function googleLogin() {
    await client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: "https://geniuskids.jp/portal.html"
      }
    });
  }
</script>

</body>
</html>
