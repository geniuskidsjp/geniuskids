<script>
  const supabaseUrl = "PASTE_PROJECT_URL_HERE";
  const supabaseKey = "PASTE_PUBLISHABLE_KEY_HERE";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);

  let currentPath = '';

  async function checkUser() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) {
      window.location.href = "login.html";
    } else {
      openFolder('');
    }
  }

  async function openFolder(path) {
    currentPath = path;
    const ul = document.getElementById('files');
    ul.innerHTML = '';

    if (path !== '') {
      const back = document.createElement('li');
      back.innerHTML = `<a href="#" onclick="goBack()">⬅ Back</a>`;
      ul.appendChild(back);
    }

    const { data, error } = await client
      .storage
      .from('resources')
      .list(path, { limit: 100 });

    data.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');

      if (item.id === null) {
        // Folder
        a.innerText = '📁 ' + item.name;
        a.href = '#';
        a.onclick = () => openFolder(path + item.name + '/');
      } else {
        // File
        a.innerText = '📄 ' + item.name;
        client.storage
          .from('resources')
          .createSignedUrl(path + item.name, 60)
          .then(res => {
            a.href = res.data.signedUrl;
          });
      }

      li.appendChild(a);
      ul.appendChild(li);
    });
  }

  function goBack() {
    const parts = currentPath.split('/').filter(p => p);
    parts.pop();
    openFolder(parts.length ? parts.join('/') + '/' : '');
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = "login.html";
  }

  checkUser();
</script>
