<!DOCTYPE html>
<html>
<head>
  <title>Student Resources - Genius Kids</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>
  <h2>Student Resources</h2>
  <button onclick="logout()">Logout</button>
  <ul id="files"></ul>

<script>
  const supabaseUrl = "https://ntfkpwfrwprrgoxidoub.supabase.co";
  const supabaseKey = "sb_publishable_J3QyzC6-gBXD9VfYRQhMtA_EZm4MYBc";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);

  let currentPath = '';

  async function checkUser() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) {
      window.location.href = "login.html";
    } else {
      openFolder('');
      showDriveLinks();
    }
  }

  async function openFolder(path) {
    currentPath = path;
    const ul = document.getElementById('files');
    ul.innerHTML = '';

    if (path !== '') {
      const back = document.createElement('li');
      back.innerHTML = `<a href="#" onclick="goBack()">⬅ Back</a>`;
      ul.appendChild(back);
    }

    const { data } = await client
      .storage
      .from('resources')
      .list(path, { limit: 100 });

    data.forEach(item => {
      const li = document.createElement('li');
      const a = document.createElement('a');

      if (item.id === null) {
        a.innerText = '📁 ' + item.name;
        a.href = '#';
        a.onclick = () => openFolder(path + item.name + '/');
      } else {
        a.innerText = '📄 ' + item.name;
        client.storage
          .from('resources')
          .createSignedUrl(path + item.name, 60)
          .then(res => {
            a.href = res.data.signedUrl;
            a.target = '_blank';
          });
      }

      li.appendChild(a);
      ul.appendChild(li);
    });
  }

  function goBack() {
    const parts = currentPath.split('/').filter(p => p);
    parts.pop();
    openFolder(parts.length ? parts.join('/') + '/' : '');
  }

  async function showDriveLinks() {
    const { data } = await client
      .from('links')
      .select('*');

    const ul = document.getElementById('files');

    data.forEach(link => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.innerText = '🔗 ' + link.title;
      a.href = link.url;
      a.target = '_blank';
      li.appendChild(a);
      ul.appendChild(li);
    });
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = "login.html";
  }

  checkUser();
</script>
