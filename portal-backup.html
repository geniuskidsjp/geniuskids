<!DOCTYPE html>
<html>
<head>
  <title>Student Resources - Genius Kids</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Student Resources</h2>
  <button onclick="logout()">Logout</button>
  <ul id="files"></ul>

<script>
  const supabaseUrl = "https://ntfkpwfrwprrgoxidoub.supabase.co";
  const supabaseKey = "sb_publishable_J3QyzC6-gBXD9VfYRQhMtA_EZm4MYBc";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function checkUser() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) {
      window.location.href = "login.html";
    } else {
      listAllFiles('');
    }
  }

  async function listAllFiles(path) {
    const { data, error } = await client
      .storage
      .from('resources')
      .list(path, { limit: 100 });

    for (const item of data) {
      if (item.id === null) {
        // It is a folder → go inside
        await listAllFiles(path + item.name + '/');
      } else {
        // It is a file → show it
        addFileToList(path + item.name);
      }
    }
  }

  function addFileToList(filepath) {
    const ul = document.getElementById('files');
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.innerText = filepath;

    client.storage
      .from('resources')
      .createSignedUrl(filepath, 60)
      .then(res => {
        a.href = res.data.signedUrl;
      });

    li.appendChild(a);
    ul.appendChild(li);
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = "login.html";
  }

  checkUser();
</script>
</body>
</html>
