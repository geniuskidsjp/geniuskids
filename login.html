<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Login | GeniusKids</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      width: 380px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    h2 { margin-bottom: 10px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .login-btn { background: #4e73df; color: white; }
    .signup-btn { background: #858796; color: white; }
    .google-btn { background: #ea4335; color: white; }
    .divider {
      margin: 18px 0;
      font-size: 13px;
      color: #999;
    }
    #msg { color: red; font-size: 13px; }
  </style>
</head>

<body>

<div class="card">
  <h2>GeniusKids Student Portal</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button class="login-btn" onclick="login()">Login</button>
  <button class="signup-btn" onclick="signup()">Sign Up</button>

  <div class="divider">OR</div>

  <button class="google-btn" onclick="googleLogin()">Sign in with Google</button>

  <p id="msg"></p>
</div>

<script>
  const supabaseUrl = "https://ntfkpwfrwprrgoxidoub.supabase.co";
  const supabaseKey = "sb_publishable_J3QyzC6-gBXD9VfYRQhMtA_EZm4MYBc";
  const client = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function login() {
    const emailVal = document.getElementById('email').value;
    const passwordVal = document.getElementById('password').value;

    const { error } = await client.auth.signInWithPassword({
      email: emailVal,
      password: passwordVal
    });

    if (error) {
      document.getElementById('msg').innerText = error.message;
    } else {
      window.location.href = "portal.html";
    }
  }

  async function signup() {
    const emailVal = document.getElementById('email').value;
    const passwordVal = document.getElementById('password').value;

    const { error } = await client.auth.signUp({
      email: emailVal,
      password: passwordVal
    });

    if (error) {
      document.getElementById('msg').innerText = error.message;
    } else {
      document.getElementById('msg').innerText =
        "Signup successful. You can now login.";
    }
  }

  async function googleLogin() {
    await client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: "https://geniuskids.jp/portal.html"
      }
    });
  }
</script>


</body>
</html>
